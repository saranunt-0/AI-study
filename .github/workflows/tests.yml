name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-run each training script
        run: |
          python -m aistudy.llm.train --steps 20 --eval-every 10 --eval-iters 2 --out-dir runs/ci_llm
          python -m aistudy.world_model.train --steps 20 --eval-every 19 --n-traj 300 --out-dir runs/ci_wm
          python -m aistudy.diffusion.train --steps 20 --sample-every 19 --out-dir runs/ci_diff
