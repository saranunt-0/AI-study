[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aistudy"
version = "0.1.0"
description = "Readable reference implementations of modern LLMs, world models and diffusion models, with an advanced AI knowledge base"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["aistudy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
